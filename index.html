:root {
  --bg: #ffffff; --card: #ffffff; --ink: #1d2621; --muted: #5a6760; --line: #c9d2cb; --dot: #e3e8e4;
  --accent: #2d6a4f; --accent-ink: #ffffff; --accent-soft: #e3f0e8;
  --warn: #8f5200; --warn-soft: #fdf1d8; --err: #a4262c; --err-soft: #fbe6e6;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a16; --card: #1a2420; --ink: #e7eee9; --muted: #9eaba3; --line: #34423b; --dot: #26322c;
    --accent: #74c69d; --accent-ink: #0e1f16; --accent-soft: #21392d;
    --warn: #e3ac55; --warn-soft: #3a2d14; --err: #f29297; --err-soft: #3d1f21;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a16; --card: #1a2420; --ink: #e7eee9; --muted: #9eaba3; --line: #34423b; --dot: #26322c;
  --accent: #74c69d; --accent-ink: #0e1f16; --accent-soft: #21392d;
  --warn: #e3ac55; --warn-soft: #3a2d14; --err: #f29297; --err-soft: #3d1f21;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: Calibri, Carlito, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.4;
}
.app { max-width: 1200px; margin: 0 auto; padding: 14px 14px 40px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
header.top h1 { font-size: 24px; margin: 0 8px 0 0; color: var(--accent); letter-spacing: 0; }
header.top .grow { flex: 1 1 260px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
select, input[type=text], textarea {
  font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; min-height: 40px; max-width: 100%;
}
select#taskSel { flex: 1 1 260px; min-width: 0; font-weight: 700; }
input#myName { width: 150px; }
textarea { resize: vertical; width: 100%; line-height: 1.35; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; margin: 6px 0; }
label.chk input { width: 18px; height: 18px; }
input[readonly] { width: 100%; font-size: 13px; }
.progress { color: var(--muted); font-size: 15px; white-space: nowrap; }
button {
  font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; min-height: 40px; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
button.danger { color: var(--err); }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.main {
  display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 14px 18px;
  grid-template-areas: "canvas task" "canvas sel" "canvas run";
  grid-template-rows: auto auto 1fr; align-items: start;
}
@media (max-width: 880px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "task" "canvas" "sel" "run"; grid-template-rows: auto; }
}
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.card h2 { font-size: 18px; margin: 0 0 6px; }
.card h3 { font-size: 16px; margin: 12px 0 4px; }
#taskCard { grid-area: task; } #canvasArea { grid-area: canvas; min-width: 0; } #selCard { grid-area: sel; } #runCard { grid-area: run; }
.stars { color: var(--accent); margin-right: 6px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
details.rules { margin: 8px 0; }
details.rules summary { cursor: pointer; font-weight: 700; }
details.rules ul { margin: 6px 0 0; padding-left: 18px; }
details.rules li { margin: 2px 0; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.result { margin-top: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
.result.ok { background: var(--accent-soft); border-color: var(--accent); }
.result.bad { background: var(--warn-soft); border-color: var(--warn); }
.result table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 14px; }
.result th, .result td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.result tr.diff td { font-weight: 700; color: var(--err); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.seg { display: inline-flex; gap: 0; }
.seg button { border-radius: 0; }
.seg button:first-child { border-radius: 8px 0 0 8px; } .seg button:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
.toolbar .sp { flex: 1; }
.canvasbox {
  overflow: auto; border: 1px solid var(--line); border-radius: 12px; background-color: var(--card);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size: 24px 24px;
}
svg#cv { display: block; width: 100%; min-width: 640px; height: auto; touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none; }
.hint { color: var(--muted); font-size: 14px; margin: 8px 2px; min-height: 20px; }
ul.issues { list-style: none; margin: 6px 0 0; padding: 0; }
ul.issues li { margin: 4px 0; padding: 6px 10px; border-radius: 8px; background: var(--warn-soft); border: 1px solid var(--warn); color: var(--ink); font-size: 15px; }
ul.issues li.fine { background: transparent; border-color: var(--line); color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.field label { font-size: 14px; color: var(--muted); }
.trow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin: 6px 0; align-items: center; }
.trow.dup select { border-color: var(--warn); background: var(--warn-soft); }
.trow select { width: 100%; }
.trow .lab { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-bottom: -2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 14px; }
.chip button { min-height: 28px; padding: 0 8px; border: none; background: transparent; color: var(--muted); }
.addrow { display: flex; gap: 6px; }
.addrow input { flex: 1; min-width: 0; }
.panel-ins { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 10px 0; }
.panel-ins button { text-align: left; min-height: 48px; font-weight: 700; display: flex; flex-direction: column; justify-content: center; }
.panel-ins button small { color: var(--muted); font-weight: 400; font-size: 12px; }
.lamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 10px; margin: 8px 0; }
.lamp { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.lamp i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.lamp.on { color: var(--ink); font-weight: 700; }
.lamp.on i { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.status { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 8px 0; }
.status b { font-size: 20px; color: var(--accent); }
ol.log { list-style: none; margin: 6px 0 0; padding: 0; max-height: 180px; overflow: auto; font-size: 14px; }
ol.log li { padding: 3px 0; border-bottom: 1px solid var(--line); }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); max-width: 420px; padding: 18px; }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog .btnrow { justify-content: flex-end; }
/* Zeichenfläche */
.st circle { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }
.st text { fill: var(--ink); font-weight: 700; text-anchor: middle; pointer-events: none; }
.st { cursor: grab; touch-action: none; }
.st.sel circle { stroke: var(--accent); stroke-width: 4.5; }
.st.cur circle { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 4.5; }
.st.pend circle { stroke: var(--accent); stroke-dasharray: 6 4; stroke-width: 4; }
.ed .line { fill: none; stroke: var(--ink); stroke-width: 2.2; marker-end: url(#ah); }
.ed .hit { fill: none; stroke: transparent; stroke-width: 24; pointer-events: stroke; cursor: pointer; touch-action: none; }
.ed.sel .line { stroke: var(--accent); stroke-width: 3.6; marker-end: url(#ahA); }
.ed.fired .line { stroke: var(--accent); stroke-width: 4; marker-end: url(#ahA); }
.ed.bad .line { stroke: var(--warn); stroke-width: 3; stroke-dasharray: 7 4; marker-end: url(#ahW); }
.lbl text { fill: var(--ink); text-anchor: middle; font-size: 13px; paint-order: stroke; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; pointer-events: none; }
.ed.sel .lbl text, .ed.fired .lbl text { fill: var(--accent); font-weight: 700; }
.startArrow { fill: none; stroke: var(--ink); stroke-width: 2.4; marker-end: url(#ah); }
.rubber { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-dasharray: 6 5; marker-end: url(#ahA); pointer-events: none; }
#mA { fill: var(--ink); } #mB { fill: var(--accent); } #mC { fill: var(--warn); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<body>
<div class="app">

    <h1>Automaten-Werkstatt</h1>
    <div class="grow">
      <select id="taskSel" aria-label="Aufgabe wählen"></select>

  </header>
  <main class="main">

    </section>
    <section class="card" id="selCard" aria-label="Auswahl"></section>

  </main>
</div>
<dialog id="dlg">
  <p id="dlgMsg" style="margin-top:0"></p>
  <div class="btnrow"><button id="dlgNo">Abbrechen</button><button id="dlgOk" class="primary">Ja</button></div>
</dialog>
<script>
'use strict';
/* ---------- Aufgaben ---------- */
const R = 38, VBW = 760, VBH = 480;

const BECHER = {
  start: 'bereit',
  pos: { 'bereit': [130, 230], 'Geld drin': [390, 230], 'Becher bereit': [650, 230] },
  trans: [
    ['bereit', 'Münze', 'Geld drin', 'Geld-Anzeige'],
    ['Geld drin', 'Münze', 'Geld drin', 'Münze zurück'],
    ['Geld drin', 'Taste', 'Becher bereit', 'Becher ins Fach'],
    ['Becher bereit', 'Münze', 'Becher bereit', 'Münze zurück'],
    ['Becher bereit', 'Entnahme', 'bereit', 'Fach zu']
  ]
};
const BECHER_IO = { inputs: ['Münze', 'Taste', 'Entnahme'], outputs: ['Geld-Anzeige', 'Münze zurück', 'Becher ins Fach', 'Fach zu'] };

const UMBAU1 = {
  start: 'bereit',
  pos: Object.assign({}, BECHER.pos, { 'Wartung': [130, 410] }),
  trans: BECHER.trans.concat([['Wartung', 'Entnahme', 'bereit', 'Fach zu']])
};
const UMBAU2 = {
  start: 'bereit', pos: BECHER.pos,
  trans: BECHER.trans.concat([['Geld drin', 'Taste', 'bereit', 'Becher ins Fach']])
};
const UMBAU3 = {
  start: 'bereit', pos: BECHER.pos,
  trans: BECHER.trans.filter(t => !(t[0] === 'Becher bereit' && t[1] === 'Entnahme'))
};

const LAMPE = {
  start: 'aus',
  pos: { 'aus': [200, 380], 'schwach': [200, 110], 'hell': [620, 110], 'blinken': [620, 380] },

    ['schwach', 'Taste kurz', 'hell', 'Lampe hell'],
    ['hell', 'Taste kurz', 'blinken', 'Lampe blinkt'],
    ['blinken', 'Taste kurz', 'aus', 'Lampe aus'],
    ['schwach', 'Taste lang', 'aus', 'Lampe aus'],
    ['hell', 'Taste lang', 'aus', 'Lampe aus'],
    ['blinken', 'Taste lang', 'aus', 'Lampe aus']
  ]
};
const LAMPE_IO = { inputs: ['Taste kurz', 'Taste lang'], outputs: ['Lampe schwach', 'Lampe hell', 'Lampe blinkt', 'Lampe aus'] };

const ALARM = {
  start: 'aus',
  pos: { 'aus': [130, 230], 'scharf': [390, 230], 'Alarm': [650, 230] },
  trans: [
    ['aus', 'Schlüssel', 'scharf', 'Piep'],
    ['scharf', 'Schlüssel', 'aus', 'Piep-Piep'],
    ['scharf', 'Bewegung', 'Alarm', 'Sirene an'],
    ['Alarm', 'Schlüssel', 'aus', 'Sirene aus']
  ]
};
const ALARM_IO = { inputs: ['Schlüssel', 'Bewegung'], outputs: ['Piep', 'Piep-Piep', 'Sirene an', 'Sirene aus'] };

const SCHRANKE = {
  start: 'zu',
  pos: { 'zu': [210, 230], 'offen': [550, 230] },
  trans: [
    ['zu', 'Ticket', 'offen', 'Schranke öffnet'],
    ['offen', 'Auto durch', 'zu', 'Schranke schließt']
  ]
};
const SCHRANKE_IO = { inputs: ['Ticket', 'Auto durch'], outputs: ['Schranke öffnet', 'Schranke schließt'] };

const AMPEL = {
  start: 'Autos grün',
  pos: { 'Autos grün': [130, 230], 'Taster gemerkt': [390, 230], 'Fußgänger grün': [650, 230] },
  trans: [
    ['Autos grün', 'Taster', 'Taster gemerkt', null],
    ['Taster gemerkt', 'Zeit abgelaufen', 'Fußgänger grün', 'Autos rot, Fußgänger grün'],
    ['Fußgänger grün', 'Zeit abgelaufen', 'Autos grün', 'Autos grün, Fußgänger rot']
  ]
};
const AMPEL_IO = { inputs: ['Taster', 'Zeit abgelaufen'], outputs: ['Autos rot, Fußgänger grün', 'Autos grün, Fußgänger rot'] };

const FAHRSTUHL = {
  start: 'unten offen',
  pos: { 'unten zu': [110, 130], 'fährt hoch': [380, 130], 'oben offen': [650, 130],
         'unten offen': [110, 360], 'fährt runter': [380, 360], 'oben zu': [650, 360] },
  trans: [
    ['unten offen', 'Zeit abgelaufen', 'unten zu', 'Tür zu'],
    ['unten zu', 'Etagen-Taste', 'fährt hoch', 'Motor hoch'],
    ['unten zu', 'Türtaste', 'unten offen', 'Tür auf'],
    ['fährt hoch', 'Ziel erreicht', 'oben offen', 'Tür auf'],
    ['oben offen', 'Zeit abgelaufen', 'oben zu', 'Tür zu'],
    ['oben zu', 'Etagen-Taste', 'fährt runter', 'Motor runter'],
    ['oben zu', 'Türtaste', 'oben offen', 'Tür auf'],
    ['fährt runter', 'Ziel erreicht', 'unten offen', 'Tür auf']
  ]
};
const FAHRSTUHL_IO = { inputs: ['Etagen-Taste', 'Türtaste', 'Zeit abgelaufen', 'Ziel erreicht'], outputs: ['Tür auf', 'Tür zu', 'Motor hoch', 'Motor runter'] };
const FAHRSTUHL_TESTS = [
  ['Zeit abgelaufen', 'Etagen-Taste', 'Ziel erreicht', 'Zeit abgelaufen', 'Etagen-Taste', 'Ziel erreicht'],
  ['Zeit abgelaufen', 'Türtaste', 'Zeit abgelaufen'],
  ['Zeit abgelaufen', 'Etagen-Taste', 'Ziel erreicht', 'Zeit abgelaufen', 'Türtaste']
];

const SCHLOSS = {
  start: 'zu',
  pos: { 'zu': [120, 240], '1 richtig': [330, 110], '1-2 richtig': [560, 110], 'offen': [650, 380] },
  trans: [
    ['zu', 'Taste 1', '1 richtig', null],
    ['zu', 'Taste 2', 'zu', 'Fehler'],
    ['1 richtig', 'Taste 2', '1-2 richtig', null],
    ['1 richtig', 'Taste 1', 'zu', 'Fehler'],
    ['1-2 richtig', 'Taste 1', 'offen', 'Tür öffnet'],
    ['1-2 richtig', 'Taste 2', 'zu', 'Fehler'],
    ['offen', 'Tür zu', 'zu', 'Schloss zu']
  ]
};
const SCHLOSS_IO = { inputs: ['Taste 1', 'Taste 2', 'Tür zu'], outputs: ['Fehler', 'Tür öffnet', 'Schloss zu'] };

const NOTHING = 'Was hier nicht beschrieben ist, ändert nichts: Der Automat bleibt im Zustand und gibt nichts aus.';
const UMBAU_TEXT = ' Der Automat soll sich wieder so verhalten wie in der ersten Doppelstunde. Probiere ihn aus, lies die Hinweise unter der Zeichnung und behebe den Fehler.';

const TASKS = [
  { id: 'becher', group: 'Nachbauen', title: 'Becher-O-Mat', stars: 1, io: BECHER_IO, ref: BECHER, check: 'exact', rules: 'So verhält sich der Becher-O-Mat',
    text: 'Baue den Becher-O-Mat nach. Lege die Zustände an, markiere den Startzustand und zeichne die Pfeile mit Eingabe und Ausgabe. ' + NOTHING },
  { id: 'lampe', group: 'Nachbauen', title: 'Taschenlampe', stars: 1, io: LAMPE_IO, ref: LAMPE, check: 'exact', rules: 'So verhält sich die Taschenlampe',
    text: 'Eine Taschenlampe hat eine Taste. Kurz drücken schaltet weiter, lang drücken schaltet sie aus. Die Ausgabe zeigt, wie die Lampe jetzt leuchtet. ' + NOTHING },
  { id: 'alarm', group: 'Nachbauen', title: 'Alarmanlage', stars: 1, io: ALARM_IO, ref: ALARM, check: 'exact', rules: 'So verhält sich die Alarmanlage',
    text: 'Baue die Alarmanlage nach. ' + NOTHING },
  { id: 'umbau1', group: 'Fehler finden', title: 'Becher-O-Mat, Umbau 1', stars: 1, io: BECHER_IO, ref: BECHER, init: UMBAU1, check: 'exact', rules: 'So soll der Becher-O-Mat sich verhalten',
    text: 'Ein Techniker hat den Becher-O-Mat umgebaut und dabei einen neuen Zustand „Wartung“ angelegt.' + UMBAU_TEXT },
  { id: 'umbau2', group: 'Fehler finden', title: 'Becher-O-Mat, Umbau 2', stars: 2, io: BECHER_IO, ref: BECHER, init: UMBAU2, check: 'exact', rules: 'So soll der Becher-O-Mat sich verhalten',
    text: 'Ein Techniker hat im Zustand „Geld drin“ einen zusätzlichen Pfeil angelegt.' + UMBAU_TEXT },
  { id: 'umbau3', group: 'Fehler finden', title: 'Becher-O-Mat, Umbau 3', stars: 2, io: BECHER_IO, ref: BECHER, init: UMBAU3, check: 'exact', rules: 'So soll der Becher-O-Mat sich verhalten',
    text: 'Ein Techniker hat einen Pfeil gelöscht.' + UMBAU_TEXT },
  { id: 'schranke', group: 'Selbst entwerfen', title: 'Parkschranke', stars: 1, io: SCHRANKE_IO, ref: SCHRANKE, check: 'exact',
    text: 'Die Schranke ist zu. Wer ein Ticket einschiebt, öffnet sie (Ausgabe: Schranke öffnet). Fährt das Auto hindurch, schließt sie wieder (Ausgabe: Schranke schließt). Weitere Tickets bei offener Schranke werden ignoriert. ' + NOTHING },
  { id: 'ampel', group: 'Selbst entwerfen', title: 'Fußgängerampel', stars: 2, io: AMPEL_IO, ref: AMPEL, check: 'exact',
    text: 'Die Autos haben grün. Drückt jemand den Taster, merkt sich die Ampel das (keine Ausgabe). Nach einer Wartezeit (Eingabe: Zeit abgelaufen) schaltet sie auf „Autos rot, Fußgänger grün“. Nach einer weiteren Zeit ist wieder alles wie am Anfang („Autos grün, Fußgänger rot“). ' + NOTHING },
  { id: 'fahrstuhl', group: 'Selbst entwerfen', title: 'Fahrstuhl', stars: 3, io: FAHRSTUHL_IO, ref: FAHRSTUHL, check: 'tests', tests: FAHRSTUHL_TESTS,
    text: 'Ein Fahrstuhl fährt zwischen zwei Etagen und steht unten mit offener Tür. Nach einer Wartezeit schließt die Tür. Die Etagen-Taste schickt ihn zur anderen Etage (Ausgabe: Motor hoch bzw. Motor runter), bei Ankunft öffnet die Tür. Die Türtaste öffnet die geschlossene Tür. Überlege, welche Zustände sich der Fahrstuhl merken muss.' },
  { id: 'schloss', group: 'Selbst entwerfen', title: 'Zahlenschloss', stars: 3, io: SCHLOSS_IO, ref: SCHLOSS, check: 'exact',
    text: 'Ein Zahlenschloss hat zwei Tasten. Der Code ist 1, 2, 1. Bei der richtigen Folge öffnet das Schloss (Ausgabe: Tür öffnet). Jede falsche Taste ergibt die Ausgabe „Fehler“, danach beginnt die Eingabe von vorn. Mit „Tür zu“ schließt das Schloss wieder (Ausgabe: Schloss zu) und beginnt von vorn. ' + NOTHING },
  { id: 'frei', group: 'Frei', title: 'Eigener Automat', stars: 0, io: { inputs: ['A', 'B'], outputs: [] }, ref: null, check: 'none', free: true,
    text: 'Entwirf einen eigenen Automaten, zum Beispiel einen Getränkeautomaten, eine Tür oder ein Spiel. Lege zuerst Eingaben und Ausgaben fest, dann die Zustände und Pfeile. Probiere ihn aus und lass ihn von anderen testen.' }
];
const TASK_BY_ID = Object.fromEntries(TASKS.map(t => [t.id, t]));
/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SEP = '\u0001';
const KEY = 'automaten-werkstatt-v1';
const starsOf = n => '★'.repeat(n);

/* ---------- Modell ---------- */
function graphFromSpec(spec, io) {
  const g = { states: [], trans: [], start: null, io: { inputs: io.inputs.slice(), outputs: io.outputs.slice() }, seq: 1 };
  const ids = Object.create(null);
  if (spec) {
    Object.entries(spec.pos).forEach(([nm, p]) => { const id = 's' + g.seq++; ids[nm] = id; g.states.push({ id, name: nm, x: p[0], y: p[1] }); });
    g.start = ids[spec.start] || null;
    spec.trans.forEach(t => g.trans.push({ id: 't' + g.seq++, from: ids[t[0]], to: ids[t[2]], input: t[1], output: t[3] == null ? null : t[3] }));
  }
  return g;
}
function newTaskState(task) {
  return { g: graphFromSpec(task.init || null, task.io), done: false };
}
function loadStore() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; }
  const s = { name: '', current: 'becher', tasks: {}, custom: {} };
  if (raw && typeof raw === 'object') {
    if (raw.custom && typeof raw.custom === 'object') Object.keys(raw.custom).slice(0, CUSTOM_MAX).forEach(k => { const c = raw.custom[k]; if (typeof c === 'string') { const rid = registerCustom(c); if (rid) s.custom[rid] = c; } });
    if (typeof raw.name === 'string') s.name = raw.name.slice(0, 24);
    if (TASK_BY_ID[raw.current]) s.current = raw.current;
    if (raw.tasks && typeof raw.tasks === 'object') {
      for (const id of Object.keys(raw.tasks)) {
        const t = raw.tasks[id], g = t && t.g;
        if (TASK_BY_ID[id] && g && Array.isArray(g.states) && Array.isArray(g.trans) && g.io && Array.isArray(g.io.inputs) && Array.isArray(g.io.outputs)) {
          s.tasks[id] = { g: { states: g.states, trans: g.trans, start: g.start || null, io: g.io, seq: g.seq || 1000 }, done: !!t.done };
        }
      }
    }
  }
  TASKS.forEach(t => { if (!s.tasks[t.id]) s.tasks[t.id] = newTaskState(t); });
  return s;
}

/* ---------- Geteilte Aufgaben (Link mit Musterlösung) ---------- */
const CUSTOM_MAX = 20;
function cleanStr(s, n) { return typeof s === 'string' ? s.replace(/[\u0000-\u001f]/g, ' ').trim().slice(0, n) : ''; }
function b64enc(str) { let bin = ''; new TextEncoder().encode(str).forEach(b => { bin += String.fromCharCode(b); }); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64dec(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); }
function customIdOf(code) { let h = 5381; for (let i = 0; i < code.length; i++) h = ((h << 5) + h + code.charCodeAt(i)) | 0; return 'x' + (h >>> 0).toString(36); }
function sanitizeCustom(d) {
  try {
    if (!d || d.v !== 1 || !Array.isArray(d.i) || !Array.isArray(d.o) || !d.p || typeof d.p !== 'object' || !Array.isArray(d.a)) return null;
    const inputs = [...new Set(d.i.slice(0, 8).map(x => cleanStr(x, 22)).filter(Boolean))];
    const outputs = [...new Set(d.o.slice(0, 8).map(x => cleanStr(x, 22)).filter(Boolean))];
    if (!inputs.length) return null;
    const pos = Object.create(null);
    for (const raw of Object.keys(d.p).slice(0, 24)) {
      const n = cleanStr(raw, 16), p = d.p[raw];
      if (!n || n === '__proto__' || pos[n] || !Array.isArray(p)) return null;
      const x = Number(p[0]), y = Number(p[1]); if (!isFinite(x) || !isFinite(y)) return null;
      pos[n] = [Math.min(VBW - R - 4, Math.max(R + 4, Math.round(x))), Math.min(VBH - R - 4, Math.max(R + 4, Math.round(y)))];
    }
    const start = cleanStr(d.s, 16); if (!pos[start]) return null;
    const seen = new Set(), trans = [];
    for (const t of d.a.slice(0, 120)) {
      if (!Array.isArray(t)) return null;
      const f = cleanStr(t[0], 16), i = cleanStr(t[1], 22), to = cleanStr(t[2], 16), o = (t[3] == null || t[3] === '') ? null : cleanStr(t[3], 22);
      if (!pos[f] || !pos[to] || !inputs.includes(i) || (o !== null && !outputs.includes(o))) return null;
      const k = f + SEP + i; if (seen.has(k)) return null; seen.add(k);
      trans.push([f, i, to, o]);
    }
    const title = cleanStr(d.t, 60); if (!title) return null;
    return { group: 'Geteilt', title, stars: 0, io: { inputs, outputs }, ref: { start, pos, trans }, check: 'exact', custom: true,
      rules: d.r ? 'So verhält sich der Automat' : false,
      text: cleanStr(d.x, 700) || ('Baue den Automaten so, dass er sich wie beschrieben verhält. ' + NOTHING) };
  } catch (e) { return null; }
}
function registerCustom(code) {
  let d = null; try { d = JSON.parse(b64dec(code)); } catch (e) { return null; }
  const t = sanitizeCustom(d); if (!t) return null;
  t.id = customIdOf(code);
  if (!TASK_BY_ID[t.id]) { TASKS.push(t); TASK_BY_ID[t.id] = t; }
  return t.id;
}
function removeCustomTask(id) {
  const i = TASKS.findIndex(t => t.id === id); if (i >= 0 && TASKS[i].custom) TASKS.splice(i, 1);
  delete TASK_BY_ID[id]; delete store.tasks[id]; delete store.custom[id];
}

let store = loadStore();
let persistTimer = null;
function persistNow() { clearTimeout(persistTimer); try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* ohne Speicher weiterarbeiten */ } }
function persist() { clearTimeout(persistTimer); persistTimer = setTimeout(persistNow, 150); }
window.addEventListener('pagehide', persistNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persistNow(); });
const curTask = () => TASK_BY_ID[store.current];
const TS = () => store.tasks[store.current];
const G = () => TS().g;
const stOf = (g, id) => g.states.find(s => s.id === id);
const nmOf = (g, id) => { const s = stOf(g, id); return s ? s.name : '?'; };

/* ---------- Zustand der Oberfläche ---------- */
let sel = null;          // {t:'state', id} | {t:'edge', from, to}
let tool = 'move';       // 'move' | 'arrow'
let mode = 'build';      // 'build' | 'test'
let pending = null;      // Quelle beim Antippen im Pfeilwerkzeug

/* ---------- Diagnose ---------- */
function issues(g) {
  const out = [];
  if (!g.states.length) return out;
  if (!g.start) out.push({ k: 'start', text: 'Lege einen Startzustand fest.' });
  const cnt = new Map();
  g.trans.forEach(t => { const k = t.from + SEP + t.input; cnt.set(k, (cnt.get(k) || 0) + 1); });
  cnt.forEach((n, k) => {
    if (n > 1) { const [f, i] = k.split(SEP); out.push({ k: 'multi', from: f, input: i, text: 'Im Zustand „' + nmOf(g, f) + '“ gibt es für „' + i + '“ mehrere Übergänge. Der Automat ist nicht eindeutig.' }); }
  });
  if (g.states.length >= 2) {
    g.states.forEach(s => {
      if (!g.trans.some(t => t.from === s.id && t.to !== s.id)) {
        out.push({ k: 'trap', text: 'Aus dem Zustand „' + s.name + '“ führt kein Pfeil zu einem anderen Zustand (Sackgasse).' });
      }
    });
  }
  if (g.start && stOf(g, g.start)) {
    const seen = new Set([g.start]), q = [g.start];
    while (q.length) { const c = q.shift(); g.trans.filter(t => t.from === c).forEach(t => { if (!seen.has(t.to)) { seen.add(t.to); q.push(t.to); } }); }
    g.states.forEach(s => { if (!seen.has(s.id)) out.push({ k: 'unreach', text: 'In den Zustand „' + s.name + '“ führt kein Weg vom Startzustand (unerreichbar).' }); });
  }
  return out;
}

/* ---------- Simulation und Prüfung ---------- */
function stepG(g, sid, input) { return g.trans.find(t => t.from === sid && t.input === input) || null; }
function simG(g, seq) {
  let s = g.start; const outs = [];
  seq.forEach(i => { const t = stepG(g, s, i); outs.push(t ? (t.output || null) : null); if (t) s = t.to; });
  return outs;
}
function refStep(ref, s, i) { const t = ref.trans.find(x => x[0] === s && x[1] === i); return t ? { to: t[2], out: t[3] == null ? null : t[3] } : { to: s, out: null }; }
function simRef(ref, seq) { let s = ref.start; const outs = []; seq.forEach(i => { const r = refStep(ref, s, i); outs.push(r.out); s = r.to; }); return outs; }

function exactDiff(g, ref, inputs) {
  const seen = new Set([g.start + SEP + ref.start]);
  const q = [{ s: g.start, r: ref.start, seq: [] }];
  while (q.length) {
    const c = q.shift();
    for (const i of inputs) {
      const a = stepG(g, c.s, i), b = refStep(ref, c.r, i);
      const oa = a ? (a.output || null) : null;
      if (oa !== b.out) return c.seq.concat([i]);
      const key = (a ? a.to : c.s) + SEP + b.to;
      if (!seen.has(key)) { seen.add(key); q.push({ s: a ? a.to : c.s, r: b.to, seq: c.seq.concat([i]) }); }
    }
  }
  return null;
}
function runCheck(task, g) {
  const iss = issues(g);
  if (!g.states.length) return { ok: false, kind: 'empty', msg: 'Die Zeichenfläche ist noch leer. Lege zuerst Zustände an.' };
  if (iss.length) return { ok: false, kind: 'issues', msg: 'Noch nicht prüfbar. Beseitige zuerst die Hinweise unter der Zeichnung.', list: iss.map(i => i.text) };
  let seq = null;
  if (task.check === 'exact') seq = exactDiff(g, task.ref, task.io.inputs);
  else if (task.check === 'tests') seq = task.tests.find(t => JSON.stringify(simG(g, t)) !== JSON.stringify(simRef(task.ref, t))) || null;
  if (seq) {
    const want = simRef(task.ref, seq), got = simG(g, seq);
    return { ok: false, kind: 'diff', seq, want, got };
  }
  return { ok: true };
}

/* ---------- Geometrie ---------- */
function unit(x, y) { const d = Math.hypot(x, y) || 1; return [x / d, y / d]; }
function wrapName(nm) {
  nm = String(nm);
  if (nm.indexOf(' ') < 0 || nm.length <= 8) return [nm];
  let best = null;
  for (let i = 0; i < nm.length; i++) {
    if (nm[i] === ' ') { const a = nm.slice(0, i), b = nm.slice(i + 1), m = Math.max(a.length, b.length); if (!best || m < best.m) best = { m, l: [a, b] }; }
  }
  return best.l;
}
function fontFor(lines) { const m = Math.max(...lines.map(l => l.length)); return m <= 7 ? 15 : m <= 9 ? 13.5 : m <= 11 ? 12 : 10.5; }
function textLines(cx, cy, lines, size, lh) {
  const y0 = cy - (lines.length - 1) * lh / 2 + size * 0.35;
  return lines.map((l, i) => '<text x="' + cx.toFixed(1) + '" y="' + (y0 + i * lh).toFixed(1) + '" style="font-size:' + size + 'px">' + esc(l) + '</text>').join('');
}
function curveClear(g, A, B, k, nx, ny, skip) {
  const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, cx = mx + nx * 2 * k, cy = my + ny * 2 * k;
  for (let t = 0.1; t < 0.95; t += 0.05) {
    const x = (1 - t) * (1 - t) * A.x + 2 * (1 - t) * t * cx + t * t * B.x, y = (1 - t) * (1 - t) * A.y + 2 * (1 - t) * t * cy + t * t * B.y;
    for (const s of g.states) { if (s === A || s === B) continue; if (Math.hypot(s.x - x, s.y - y) < R + 12) return false; }
  }

}
function edgeGeom(g, A, B, paired) {
  const dx = B.x - A.x, dy = B.y - A.y, dist = Math.hypot(dx, dy) || 1, nx = -dy / dist, ny = dx / dist;
  const down = ny > 0 || (ny === 0 && nx > 0) ? 1 : -1; // Vorzeichen, bei dem die Beule nach unten zeigt
  let cands;
  if (paired) cands = [34, 0.25 * dist, 0.45 * dist];
  else cands = [0, down * 0.22 * dist, -down * 0.22 * dist, down * 0.4 * dist, -down * 0.4 * dist];
  let k = cands[0];
  for (const c of cands) { if (curveClear(g, A, B, c, nx, ny)) { k = c; break; } }
  const cx = (A.x + B.x) / 2 + nx * 2 * k, cy = (A.y + B.y) / 2 + ny * 2 * k;
  const [ux, uy] = unit(cx - A.x, cy - A.y), [vx, vy] = unit(cx - B.x, cy - B.y);
  const sx = A.x + ux * R, sy = A.y + uy * R, ex = B.x + vx * (R + 4), ey = B.y + vy * (R + 4);
  const px = 0.25 * sx + 0.5 * cx + 0.25 * ex, py = 0.25 * sy + 0.5 * cy + 0.25 * ey;
  let ox, oy;
  if (k !== 0) { const sg = Math.sign(k); ox = nx * sg; oy = ny * sg; } else { if (ny > 0 || (ny === 0 && nx < 0)) { ox = -nx; oy = -ny; } else { ox = nx; oy = ny; } }
  if (k === 0 && ny === 0) { ox = 0; oy = -1; }
  return { d: 'M ' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' Q ' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + ex.toFixed(1) + ' ' + ey.toFixed(1), px, py, ox, oy };
}
function loopGeom(A) {
  const up = A.y > 150 ? -1 : 1, x = A.x, y = A.y;
  const d = 'M ' + (x - 22) + ' ' + (y + up * 31) + ' C ' + (x - 62) + ' ' + (y + up * (R + 62)) + ', ' + (x + 62) + ' ' + (y + up * (R + 62)) + ', ' + (x + 22) + ' ' + (y + up * 31);
  return { d, lx: x, ly: y + up * (R + 52), up };
}
function labelLines(rows) {
  const out = [];
  rows.forEach(t => { const s = t.input + (t.output ? ' / ' + t.output : ''); if (t.output && s.length > 26) { out.push(t.input + ' /'); out.push(t.output); } else out.push(s); });

}
/* ---------- Zeichnen ---------- */
const svg = $('#cv');
function renderCanvas() {
  const g = G(), iss = issues(g), bad = new Set();
  iss.filter(i => i.k === 'multi').forEach(i => g.trans.filter(t => t.from === i.from && t.input === i.input).forEach(t => bad.add(t.from + '>' + t.to)));
  const groups = new Map();
  g.trans.forEach(t => { const k = t.from + '>' + t.to; if (!groups.has(k)) groups.set(k, { from: t.from, to: t.to, rows: [] }); groups.get(k).rows.push(t); });
  let h = '<defs>' +
    '<marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path id="mA" d="M0 0L12 6L0 12z"/></marker>' +
    '<marker id="ahA" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path id="mB" d="M0 0L12 6L0 12z"/></marker>' +
    '<marker id="ahW" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path id="mC" d="M0 0L12 6L0 12z"/></marker></defs>';
  groups.forEach((grp, key) => {
    const A = stOf(g, grp.from), B = stOf(g, grp.to);
    if (!A || !B) return;
    const lines = labelLines(grp.rows), L = lines.length;
    let d, lx, ly;
    if (A === B) {
      const lg = loopGeom(A); d = lg.d; lx = lg.lx; ly = A.y + lg.up * (R + 44 + 7.5 * L);
    } else {
      const paired = groups.has(grp.to + '>' + grp.from), ge = edgeGeom(g, A, B, paired);
      const hw = Math.max(...lines.map(x => x.length)) * 3.3, dist = 12 + Math.abs(ge.oy) * 7.5 * L + Math.abs(ge.ox) * hw;
      d = ge.d; lx = ge.px + ge.ox * dist; ly = ge.py + ge.oy * dist;

    const fired = mode === 'test' && run && run.last === key;
    h += '<g class="ed' + (isSel ? ' sel' : '') + (fired ? ' fired' : '') + (bad.has(key) ? ' bad' : '') + '" data-from="' + grp.from + '" data-to="' + grp.to + '">' +
      '<path class="hit" d="' + d + '"/><path class="line" d="' + d + '"/><g class="lbl">' + textLines(lx, ly, lines, 13, 15) + '</g></g>';
  });

    h += '<g class="' + cls + '" data-node="' + s.id + '"><circle cx="' + s.x + '" cy="' + s.y + '" r="' + R + '"/>' + textLines(s.x, s.y, lines, fs, fs + 3) + '</g>';
  });
  if (rubber) h += '<path class="rubber" d="M ' + rubber.x1 + ' ' + rubber.y1 + ' L ' + rubber.x2 + ' ' + rubber.y2 + '"/>';
  svg.innerHTML = h;
}

function makeShare() {

  const p = {}; g.states.forEach(s => { p[s.name.trim()] = [Math.round(s.x), Math.round(s.y)]; });
  const obj = { v: 1, t: share.title.trim(), x: share.text.trim(), r: share.rules ? 1 : 0, i: g.io.inputs, o: g.io.outputs, s: nmOf(g, g.start).trim(), p,
    a: g.trans.map(t => [nmOf(g, t.from).trim(), t.input, nmOf(g, t.to).trim(), t.output]) };

function handleLink() {
  const q = new URLSearchParams(location.search), hp = new URLSearchParams(location.hash.replace(/^#/, ''));
  const code = hp.get('t'), a = q.get('a') || hp.get('a');
  let msg = '', target = null;

    const id = registerCustom(code);
    if (id) {
      if (!store.custom[id]) {

  if (sel.t === 'state') {
    const s = stOf(g, sel.id);
    el.innerHTML = '<h2>Zustand</h2><div class="field"><label for="stName">Name</label><input type="text" id="stName" maxlength="16" value="' + esc(s.name) + '"></div>' +
      '<div class="btnrow"><button id="stStart" aria-pressed="' + (g.start === s.id) + '">Startzustand</button><button id="stLoop">Schleife</button><button id="stDel" class="danger">Löschen</button></div>';
    return;
  }
  const rows = g.trans.filter(t => t.from === sel.from && t.to === sel.to);
  const dupIn = new Set(g.trans.filter(t => t.from === sel.from).map(t => t.input).filter((i, _, a) => a.filter(x => x === i).length > 1));
  el.innerHTML = '<h2>Pfeil: ' + esc(nmOf(g, sel.from)) + ' → ' + esc(nmOf(g, sel.to)) + '</h2>' +
    rows.map(t => '<div class="trow' + (dupIn.has(t.input) ? ' dup' : '') + '" data-tid="' + t.id + '"><span class="lab">Eingabe / Ausgabe</span>' +
      '<select data-f="input" aria-label="Eingabe">' + optHtml(g.io.inputs, t.input, false) + '</select>' +
      '<select data-f="output" aria-label="Ausgabe">' + optHtml(g.io.outputs, t.output, true) + '</select>' +
      '<button data-del="' + t.id + '" class="danger" aria-label="Zeile entfernen">✕</button></div>').join('') +
    '<div class="btnrow"><button id="edAdd">+ Weitere Eingabe</button><button id="edDel" class="danger">Pfeil löschen</button></div>';
}
function select(s) { sel = s; renderSel(); renderCanvas(); }

/* ---------- Bearbeiten ---------- */
function changed() { lastResult = null; persist(); renderCanvas(); renderIssues(); renderResult(); }
function freeSpot(g) {
  const xs = [130, 390, 650, 260, 520], ys = [230, 380, 90, 310];
  for (const y of ys) for (const x of xs) { if (g.states.every(s => Math.hypot(s.x - x, s.y - y) >= 100)) return [x, y]; }
  return [60 + Math.random() * 640, 60 + Math.random() * 360];
}
function addState() {
  const g = G(); let n = 1; while (g.states.some(s => s.name === 'Z' + n)) n++;
  const [x, y] = freeSpot(g), id = 's' + g.seq++;
  g.states.push({ id, name: 'Z' + n, x, y });
  if (!g.start && g.states.length === 1) g.start = id;
  sel = { t: 'state', id }; renderSel(); changed();
  if (window.matchMedia && matchMedia('(pointer:fine)').matches) { const f = $('#stName'); if (f) { f.focus(); f.select(); } }
}
function delState(id) {
  const g = G(); g.states = g.states.filter(s => s.id !== id); g.trans = g.trans.filter(t => t.from !== id && t.to !== id);
  if (g.start === id) g.start = null; sel = null; renderSel(); changed();
}
function addTrans(from, to) {
  const g = G();
  if (!g.io.inputs.length) { flash('Lege zuerst mindestens eine Eingabe fest (Aufgabenkarte oben).'); return; }
  const used = g.trans.filter(t => t.from === from).map(t => t.input);
  const input = g.io.inputs.find(i => !used.includes(i)) || g.io.inputs[0];
  g.trans.push({ id: 't' + g.seq++, from, to, input, output: null });
  sel = { t: 'edge', from, to }; renderSel(); changed();
}
function svgPoint(e) { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const m = svg.getScreenCTM(); return m ? pt.matrixTransform(m.inverse()) : { x: 0, y: 0 }; }
function nodeAt(p, g) { return g.states.find(s => Math.hypot(s.x - p.x, s.y - p.y) <= R + 14) || null; }

svg.addEventListener('pointerdown', e => {
  if (mode !== 'build') return;
  const g = G(), node = e.target.closest('[data-node]'), edge = e.target.closest('.ed');
  if (node) {
    const id = node.dataset.node, s = stOf(g, id), p = svgPoint(e);
    if (tool === 'move') { select({ t: 'state', id }); drag = { kind: 'move', id, dx: p.x - s.x, dy: p.y - s.y, x0: e.clientX, y0: e.clientY, moved: false }; }
    else drag = { kind: 'arrow', src: id, x0: e.clientX, y0: e.clientY, moved: false };
    try { svg.setPointerCapture(e.pointerId); } catch (_) { /* ok */ }
    e.preventDefault();
  } else if (edge) { pending = null; select({ t: 'edge', from: edge.dataset.from, to: edge.dataset.to }); renderHint(); }
  else { pending = null; select(null); renderHint(); }
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const g = G(), p = svgPoint(e), far = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
  if (drag.kind === 'move') {
    if (far > 3) drag.moved = true;
    const s = stOf(g, drag.id); if (!s) return;
    s.x = Math.min(VBW - R - 4, Math.max(R + 4, Math.round(p.x - drag.dx))); s.y = Math.min(VBH - R - 4, Math.max(R + 4, Math.round(p.y - drag.dy)));
    renderCanvas();
  } else if (far > 8) {
    drag.moved = true; const s = stOf(g, drag.src); rubber = { x1: s.x, y1: s.y, x2: p.x, y2: p.y }; renderCanvas();
  }
});
function endDrag(e) {
  if (!drag) return;
  const g = G(), d = drag; drag = null; rubber = null;
  if (d.kind === 'move') { if (d.moved) { persist(); renderCanvas(); } return; }
  if (d.moved) {
    const tgt = nodeAt(svgPoint(e), g); pending = null;
    if (tgt && tgt.id !== d.src) addTrans(d.src, tgt.id); else renderCanvas();
  } else if (pending) { const src = pending; pending = null; addTrans(src, d.src); }
  else { pending = d.src; renderCanvas(); }
  renderHint();
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', () => { drag = null; rubber = null; renderCanvas(); });

/* ---------- Bedienfeld und Probelauf ---------- */
function startRun() { const g = G(); run = { state: g.start, n: 0, outs: 0, lamp: null, last: null, log: [] }; }
function press(input) {
  if (mode !== 'test' || !run) return;
  const g = G(), t = stepG(g, run.state, input); run.n++;
  if (t) {
    run.last = t.from + '>' + t.to; run.lamp = t.output || null; if (t.output) run.outs++;
    run.log.unshift('<b>' + esc(input) + '</b> → ' + esc(nmOf(g, t.to)) + (t.output ? ', Ausgabe: ' + esc(t.output) : ', keine Ausgabe'));
    run.state = t.to;
  } else {
    run.last = null; run.lamp = null;
    run.log.unshift('<b>' + esc(input) + '</b>: nichts passiert, bleibt in ' + esc(nmOf(g, run.state)));
  }
  if (run.log.length > 60) run.log.pop();
  renderCanvas(); renderRun();
}
function renderRun() {
  const g = G(), el = $('#runCard'), test = mode === 'test' && run;
  let h = '<h2>Bedienfeld</h2>';
  if (test) h += '<div class="status"><span>Zustand: <b>' + esc(nmOf(g, run.state)) + '</b></span><span>Eingaben: ' + run.n + '</span><span>Ausgaben: ' + run.outs + '</span></div>';
  else h += '<p class="muted small" style="margin:0 0 6px">Zum Ausprobieren: Wechsle oben auf „Testen“ oder drücke „Ausprobieren“.</p>';
  h += '<div class="panel-ins">' + (g.io.inputs.length ? g.io.inputs.map((n, i) => '<button data-in="' + esc(n) + '"' + (test ? '' : ' disabled') + '>' + esc(n) + '<small>Eingang I' + (i + 1) + (test && i < 9 ? ', Taste ' + (i + 1) : '') + '</small></button>').join('') : '<span class="muted small">Noch keine Eingaben festgelegt.</span>') + '</div>';
  if (g.io.outputs.length) h += '<div class="lamps">' + g.io.outputs.map((n, i) => '<span class="lamp' + (test && run.lamp === n ? ' on' : '') + '"><i></i>Q' + (i + 1) + ' ' + esc(n) + '</span>').join('') + '</div>';
  if (test) h += '<ol class="log" aria-live="polite">' + run.log.map(l => '<li>' + l + '</li>').join('') + '</ol>';
  h += '<div class="btnrow">' + (test ? '<button id="runReset">Zurück zum Start</button><button id="runBack">Weiter bauen</button>' : '<button class="primary" id="runStart">Ausprobieren</button>') + '</div>';
  el.innerHTML = h;
}
function setMode(m) {
  const g = G();
  if (m === 'test') {
    const iss = issues(g);
    if (!g.states.length) { flash('Lege zuerst Zustände an.'); return; }
    if (!g.start) { flash('Lege zuerst einen Startzustand fest (Zustand antippen, dann „Startzustand“).'); return; }
    if (iss.some(i => i.k === 'multi')) { flash('Der Automat ist nicht eindeutig: ' + iss.find(i => i.k === 'multi').text); return; }
    startRun(); pending = null; sel = null;
  } else run = null;
  mode = m; renderAll();
}
function renderToolbar() {
  $('#toolMove').setAttribute('aria-pressed', tool === 'move'); $('#toolArrow').setAttribute('aria-pressed', tool === 'arrow');
  $('#modeBuild').setAttribute('aria-pressed', mode === 'build'); $('#modeTest').setAttribute('aria-pressed', mode === 'test');
  ['btnAdd', 'toolMove', 'toolArrow'].forEach(id => { $('#' + id).disabled = mode === 'test'; });
}
function renderAll() { renderHeader(); renderTask(); renderCanvas(); renderIssues(); renderHint(); renderSel(); renderRun(); renderToolbar(); }

/* ---------- Dialog ---------- */
function ask(msg, ok) {
  return new Promise(res => {
    const d = $('#dlg'); $('#dlgMsg').textContent = msg; $('#dlgOk').textContent = ok || 'Ja';
    if (!d.showModal) { res(window.confirm(msg)); return; }
    const done = v => { d.close(); res(v); };
    $('#dlgOk').onclick = () => done(true); $('#dlgNo').onclick = () => done(false); d.oncancel = () => res(false);
    d.showModal();
  });
}

/* ---------- Ereignisse ---------- */
$('#btnAdd').onclick = addState;
$('#toolMove').onclick = () => { tool = 'move'; pending = null; renderToolbar(); renderHint(); renderCanvas(); };
$('#toolArrow').onclick = () => { tool = 'arrow'; renderToolbar(); renderHint(); };
$('#modeBuild').onclick = () => setMode('build');
$('#modeTest').onclick = () => setMode('test');
$('#taskSel').onchange = e => { store.current = e.target.value; sel = null; mode = 'build'; run = null; pending = null; lastResult = null; persist(); renderAll(); };
$('#myName').oninput = e => { store.name = e.target.value.slice(0, 24); persist(); };

$('#selCard').addEventListener('input', e => {
  if (e.target.id === 'stName' && sel && sel.t === 'state') { const s = stOf(G(), sel.id); if (s) { s.name = e.target.value; changed(); } }
});
$('#selCard').addEventListener('change', e => {
  const row = e.target.closest('.trow'); if (!row) return;
  const t = G().trans.find(x => x.id === row.dataset.tid); if (!t) return;
  const f = e.target.dataset.f; if (f === 'input') t.input = e.target.value; else t.output = e.target.value || null;
  renderSel(); changed();
});
$('#selCard').addEventListener('focusout', e => {
  if (e.target.id === 'stName' && sel && sel.t === 'state') { const s = stOf(G(), sel.id); if (s && !s.name.trim()) { s.name = 'Z' + s.id.slice(1); e.target.value = s.name; changed(); } }
});
$('#selCard').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const g = G();
  if (b.id === 'stStart') { g.start = g.start === sel.id ? null : sel.id; renderSel(); changed(); }
  else if (b.id === 'stLoop') addTrans(sel.id, sel.id);
  else if (b.id === 'stDel') delState(sel.id);
  else if (b.id === 'edAdd') addTrans(sel.from, sel.to);
  else if (b.id === 'edDel') { g.trans = g.trans.filter(t => !(t.from === sel.from && t.to === sel.to)); sel = null; renderSel(); changed(); }
  else if (b.dataset.del) { g.trans = g.trans.filter(t => t.id !== b.dataset.del); renderSel(); changed(); }
});
$('#taskCard').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; const t = curTask(), g = G();
  if (b.id === 'btnCheck') { lastResult = runCheck(t, g); if (lastResult.ok) { TS().done = true; persist(); renderHeader(); } renderResult(); }
  else if (b.id === 'btnSolution') {
    if (await ask('Willst du die Musterlösung wirklich sehen? Deine Zeichnung wird dadurch ersetzt. Probiere es erst selbst.', 'Musterlösung zeigen')) {
      TS().g = graphFromSpec(t.ref, t.io); sel = null; mode = 'build'; run = null; pending = null; lastResult = null; persist(); renderAll();
    }
  } else if (b.id === 'btnReset') {
    if (await ask('Deine Zeichnung zu dieser Aufgabe wird gelöscht und der Anfang wiederhergestellt.', 'Neu beginnen')) {
      const done = TS().done; store.tasks[t.id] = newTaskState(t); store.tasks[t.id].done = done; sel = null; mode = 'build'; run = null; pending = null; lastResult = null; persist(); renderAll();
    }
  } else if (b.dataset.rm) {
    const arr = b.dataset.rm === 'in' ? g.io.inputs : g.io.outputs, name = arr[+b.dataset.i];
    arr.splice(+b.dataset.i, 1);
    g.trans = g.trans.filter(x => b.dataset.rm === 'in' ? x.input !== name : true);
    if (b.dataset.rm === 'out') g.trans.forEach(x => { if (x.output === name) x.output = null; });
    renderTask(); renderSel(); changed();
  } else if (b.dataset.add) { addIo(b.dataset.add); }
  else if (b.id === 'shMake') makeShare();
  else if (b.id === 'shCopy') copyShare();
  else if (b.id === 'btnRemove') {
    if (await ask('Diese geteilte Aufgabe wird samt deiner Zeichnung von diesem Gerät entfernt. Der Link funktioniert weiterhin.', 'Entfernen')) {
      const id = t.id; store.current = 'becher'; removeCustomTask(id); sel = null; mode = 'build'; run = null; pending = null; lastResult = null; persist(); renderAll();
    }
  }
});
function addIo(kind) {
  const inp = $('#add_' + kind), g = G(), v = inp.value.trim(); if (!v) return;
  const arr = kind === 'in' ? g.io.inputs : g.io.outputs;
  if (!arr.includes(v) && arr.length < 8) arr.push(v);
  refocus = '#add_' + kind; renderTask(); renderRun(); renderSel(); persist();
}
$('#taskCard').addEventListener('input', e => { if (e.target.id === 'shTitle') share.title = e.target.value; else if (e.target.id === 'shText') share.text = e.target.value; });
$('#taskCard').addEventListener('change', e => { if (e.target.id === 'shRules') share.rules = e.target.checked; });
$('#taskCard').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id && e.target.id.startsWith('add_')) { e.preventDefault(); addIo(e.target.id.slice(4)); } });
$('#runCard').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.in !== undefined) press(b.dataset.in);
  else if (b.id === 'runStart') setMode('test');
  else if (b.id === 'runReset') { startRun(); renderCanvas(); renderRun(); }
  else if (b.id === 'runBack') setMode('build');
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (mode === 'build' && (e.key === 'Delete' || e.key === 'Backspace') && sel) {
    e.preventDefault(); const g = G();
    if (sel.t === 'state') delState(sel.id); else { g.trans = g.trans.filter(t => !(t.from === sel.from && t.to === sel.to)); sel = null; renderSel(); changed(); }
  } else if (e.key === 'Escape') { pending = null; sel = null; renderSel(); renderCanvas(); renderHint(); }
  else if (mode === 'test' && /^[1-9]$/.test(e.key)) { const i = G().io.inputs[+e.key - 1]; if (i) press(i); }
});
const linkMsg = handleLink();
renderAll();
if (linkMsg) flash(linkMsg);
</script>
</body>
</html>
